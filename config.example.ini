# ============================================================
# RPA Enterprise Automation - configuration template
# Copy this file to `config.ini` and fill in real values.
# Every value can also be overridden by an environment variable
# (see the [env_var] hints) so secrets never live in this repo.
# ============================================================

[general]
company_name = ACME GmbH
region = de

[database]
# SQLite database path (orders + run audit log)
db_path = data/orders.db

[ingest]
# Data source channel: mock | api
#   mock -> reads from mock_order_file (generates one if missing)
#   api  -> pulls orders from a real REST API (WooCommerce/Shopify style)
mode = mock
mock_order_file = data/raw/orders_raw.csv
# Number of rows to generate when the mock file does not exist yet
mock_order_count = 300
# Random seed so demo data is reproducible
mock_seed = 42

# --- API channel (only used when mode = api) -----------------
api_url = https://example.com/wp-json/wc/v3/orders
# WooCommerce: basic auth (consumer key / consumer secret)
api_consumer_key =
api_consumer_secret =
# Shopify: admin API access token (Bearer)
api_token =
# If the API call fails and api_fallback_to_mock is true, the
# pipeline degrades gracefully to the mock channel.
api_fallback_to_mock = true
api_timeout_sec = 30

[cleaning]
# Comma separated columns that must be present and non-empty
required_fields = order_id, customer, amount
# Column used to detect duplicate orders
duplicate_key = order_id
# Amounts outside [min_amount, max_amount] are flagged as invalid
min_amount = 0
max_amount = 100000

[report]
output_dir = data/reports
# Company currency symbol used in the Excel report
currency_symbol = EUR

[alert]
# SMTP settings - NEVER commit real credentials.
# Use an environment variable override instead:
#   RPA_SMTP_HOST / RPA_SMTP_PORT / RPA_SMTP_SENDER /
#   RPA_SMTP_PASSWORD / RPA_SMTP_RECEIVER
smtp_host = smtp.qq.com
smtp_port = 465
sender =
password =
receiver =
# Retry sending the alert this many times on failure
retry_times = 3
retry_interval_sec = 5
# Send an alert after this many consecutive failed runs
alert_after_consecutive_failures = 2
